name: Hatem Multi Media on Nuvio ARC

on:
  push:
    branches: [feat/hatem-arc-live-tv]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: hatem-arc-debug-signing-v1
      - name: Prepare ARC build properties
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.LOCAL_PROPERTIES_BASE64 }}
          LOCAL_DEV_PROPERTIES_BASE64: ${{ secrets.LOCAL_DEV_PROPERTIES_BASE64 }}
        run: |
          printf '%s' "$LOCAL_PROPERTIES_BASE64" | base64 --decode > local.properties
          printf '%s' "$LOCAL_DEV_PROPERTIES_BASE64" | base64 --decode > local.dev.properties
          if [ ! -s "$HOME/.android/debug.keystore" ]; then
            echo "The existing Hatem ARC signing keystore is required. Refusing to generate a replacement."
            exit 1
          fi
      - name: Verify Live TV, playback and ARC navigation
        run: >-
          ./gradlew :app:testFullDebugUnitTest
          --tests 'com.nuvio.tv.ui.screens.livetv.*'
          --tests 'com.nuvio.tv.ui.screens.player.LegacyLivePlayer*'
          --tests 'com.nuvio.tv.AppRootRoutesTest'
          --tests 'com.nuvio.tv.updater.*'
          --tests 'com.nuvio.tv.core.tmdb.TmdbMetadataServiceTest'
          --tests 'com.nuvio.tv.data.repository.TraktAuthServiceTest'
          --tests 'com.nuvio.tv.data.simkl.SimklApiClientTest'
          --tests 'com.nuvio.tv.data.simkl.SimklAuthRepositoryTest'
          -ParcVersionCode=1570 -PnuvioAppIdSuffix=.hatemarcstable -ParcVersionName=1.1.0-nt.9.2-hatem.3 --stacktrace
      - name: Compile Android tests and assemble ARM APKs
        run: |
          ./gradlew :app:compileFullDebugAndroidTestKotlin :app:assembleFullDebug \
            "-PhatemArcSigningKeyPath=$HOME/.android/debug.keystore" \
            "-PhatemArcLauncherLabel=Hatem Multi Media ARC" \
            -ParcVersionCode=1570 -PnuvioAppIdSuffix=.hatemarcstable -ParcVersionName=1.1.0-nt.9.2-hatem.3 --stacktrace
          expected_cert=$(keytool -exportcert -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey | sha256sum | cut -d ' ' -f 1)
          test "${#expected_cert}" -eq 64
          apksigner=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          for abi in armeabi-v7a arm64-v8a; do
            signed_apk="app/build/outputs/apk/full/debug/app-full-$abi-debug.apk"
            actual_cert=$("$apksigner" verify --print-certs "$signed_apk" | awk '/Signer #1 certificate SHA-256 digest:/{print $NF}')
            test "$actual_cert" = "$expected_cert"
            cp "app/build/outputs/apk/full/debug/app-full-$abi-debug.apk" \
              "Hatem-Multi-Media-ARC-MiBox-1.1.0-nt.9.2-hatem.3-$abi.apk"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: Hatem-Multi-Media-ARC-MiBox-ARM
          path: Hatem-Multi-Media-ARC-MiBox-1.1.0-nt.9.2-hatem.3-*.apk
          if-no-files-found: error
