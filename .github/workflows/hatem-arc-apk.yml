name: Hatem Multi Media on Nuvio ARC

on:
  push:
    branches: [feat/hatem-arc-live-tv]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: hatem-arc-debug-signing-v1
      - name: Prepare ARC build properties
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.LOCAL_PROPERTIES_BASE64 }}
          LOCAL_DEV_PROPERTIES_BASE64: ${{ secrets.LOCAL_DEV_PROPERTIES_BASE64 }}
        run: |
          printf '%s' "$LOCAL_PROPERTIES_BASE64" | base64 --decode > local.properties
          printf '%s' "$LOCAL_DEV_PROPERTIES_BASE64" | base64 --decode > local.dev.properties
          if [ ! -s ~/.android/debug.keystore ]; then
            mkdir -p ~/.android
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname 'CN=Hatem ARC Debug,O=HatemTV,C=TN'
          fi
      - name: Verify Live TV, playback and ARC navigation
        run: >-
          ./gradlew :app:testFullDebugUnitTest
          --tests 'com.nuvio.tv.ui.screens.livetv.*'
          --tests 'com.nuvio.tv.ui.screens.player.LegacyLivePlayer*'
          --tests 'com.nuvio.tv.AppRootRoutesTest'
          --tests 'com.nuvio.tv.updater.*'
          -PhatemUniversalApk=true -PnuvioAppIdSuffix=.hatemarc -ParcVersionName=1.1.0-nt.9.2-hatem.1 --stacktrace
      - name: Compile Android tests and assemble the universal APK
        run: |
          ./gradlew :app:compileFullDebugAndroidTestKotlin :app:assembleFullDebug \
            -PhatemUniversalApk=true -PnuvioAppIdSuffix=.hatemarc -ParcVersionName=1.1.0-nt.9.2-hatem.1 --stacktrace
          cp app/build/outputs/apk/full/debug/app-full-universal-debug.apk Hatem-Multi-Media-ARC-MiBox-1.1.0-nt.9.2-hatem.1.apk
      - uses: actions/upload-artifact@v7
        with:
          name: Hatem-Multi-Media-ARC-MiBox
          path: Hatem-Multi-Media-ARC-MiBox-1.1.0-nt.9.2-hatem.1.apk
          if-no-files-found: error
