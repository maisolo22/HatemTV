name: Hatem Multi Media on Nuvio ARC

on:
  push:
    branches: [feat/hatem-arc-live-tv]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure ARC Trakt device activation
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.LOCAL_PROPERTIES_BASE64 }}
          LOCAL_DEV_PROPERTIES_BASE64: ${{ secrets.LOCAL_DEV_PROPERTIES_BASE64 }}
          # Public OAuth application identifier registered for Hatem Multi Media.
          TRAKT_CLIENT_ID: ${{ vars.TRAKT_CLIENT_ID || 'zJKj0x4Q8nikm2kkBX9mYoAvAIbrmg4lwS8_qjR-Evg' }}
        run: |
          umask 077
          printf '%s' "$LOCAL_PROPERTIES_BASE64" | base64 --decode > local.properties
          printf '%s' "$LOCAL_DEV_PROPERTIES_BASE64" | base64 --decode > local.dev.properties
          if [[ ! "$TRAKT_CLIENT_ID" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo '::error::ARC automatic Trakt activation needs a valid Trakt Client ID.'
            exit 1
          fi
          printf '\n\nTRAKT_CLIENT_ID=%s\nTRAKT_CLIENT_SECRET=\n' "$TRAKT_CLIENT_ID" >> local.properties
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: hatem-arc-debug-signing-v1
      - name: Build ARM APKs and sign with the fixed certificate
        run: |
          if [ ! -s "$HOME/.android/debug.keystore" ]; then
            echo '::error::The existing Hatem ARC signing keystore is required.'
            exit 1
          fi
          expected_cert=$(keytool -exportcert -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey | sha256sum | cut -d ' ' -f 1)
          test "$expected_cert" = 60d2d0a81782f6b06459db600ca68179dd4502d7fc9350ab45c9dab6dfa859f9
          ./gradlew :app:testFullDebugUnitTest --tests com.nuvio.tv.data.repository.TraktAuthServiceTest \
            --tests com.nuvio.tv.ui.screens.iptv.IptvPlaylistTest \
            :app:compileFullDebugAndroidTestKotlin :app:assembleFullDebug \
            "-PhatemArcLauncherLabel=Hatem Multi Media ARC" \
            -ParcVersionCode=1575 -PnuvioAppIdSuffix=.hatemarcstable -ParcVersionName=1.1.0-nt.9.2-hatem.8 --stacktrace
          apksigner=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          for abi in armeabi-v7a arm64-v8a; do
            unsigned_source="app/build/outputs/apk/full/debug/app-full-$abi-debug.apk"
            output_apk="Hatem-Multi-Media-ARC-MiBox-1.1.0-nt.9.2-hatem.8-$abi.apk"
            "$apksigner" sign --ks "$HOME/.android/debug.keystore" --ks-pass pass:android \
              --key-pass pass:android --ks-key-alias androiddebugkey --out "$output_apk" "$unsigned_source"
            verification=$("$apksigner" verify --print-certs "$output_apk")
            printf '%s\n' "$verification"
            actual_cert=$(printf '%s\n' "$verification" | awk '/certificate SHA-256 digest:/{print tolower($NF)}' | sort -u)
            if [ "$actual_cert" != "$expected_cert" ]; then
              printf 'Unexpected signing certificate for %s (expected %s, saw %s)\n' "$abi" "$expected_cert" "$actual_cert"
              exit 1
            fi
          done
      - uses: actions/upload-artifact@v7
        with:
          name: Hatem-Multi-Media-ARC-MiBox-ARM
          path: Hatem-Multi-Media-ARC-MiBox-1.1.0-nt.9.2-hatem.8-*.apk
          if-no-files-found: error
