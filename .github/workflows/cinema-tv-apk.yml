name: HatemTV APK

on:
  push:
    branches: [feat/tv-cinema-home]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Test discovery and home focus
        run: >-
          ./gradlew :app:testFullDebugUnitTest
          --tests 'com.nuvio.tv.ui.screens.search.SearchViewModelPaginationTest'
          --tests 'com.nuvio.tv.ui.screens.home.ModernHomeIdentityRelocationTest'
      - name: Compile the server connection regression test
        run: ./gradlew :app:compileFullDebugAndroidTestKotlin
      - name: Build the universal APK
        run: |
          ./gradlew :app:assembleFullDebug
          cp app/build/outputs/apk/full/debug/app-full-universal-debug.apk HatemTV-MiBox.apk
      - name: Verify the HatemTV package identifier
        run: |
          analyzer="$(find -L "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name apkanalyzer -print -quit)"
          package="$("$analyzer" manifest application-id HatemTV-MiBox.apk)"
          if [ "$package" != com.maisolo.hatemtv ]; then
            printf 'Unexpected APK package: %s\n' "$package" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: HatemTV-MiBox
          path: HatemTV-MiBox.apk
          if-no-files-found: error
